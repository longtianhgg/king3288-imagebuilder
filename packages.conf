# KING3288 软件包功能选择（底层依赖由 ImageBuilder/opkg 自动解析）
# 在包名前加 # 可禁用，例如 #tailscale
# 注意：被其他软件依赖的包无法独立删除；构建会报告依赖冲突。
# Docker 使用 Actions 的 docker 开关，一键启用/关闭整套 Docker。
# 历史完整 296 包清单在 board/king3288-configs/ 中保留，供对照。
